  longitude:
    name: longitude
    standard_name: longitude
    long_name: "Longitude"
    units: degree
    resolution: [1000, 4000, 8000]
    file_type: [h5_std]

  latitude:
    name: latitude
    standard_name: latitude
    long_name: "Latitude"
    units: degree
    resolution: [1000, 4000, 8000]
    file_type: [h5_std]
