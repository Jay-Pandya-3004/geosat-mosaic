        units: mW.cm-2.sr-1.micron-1
      counts:
        standard_name: counts
        units: count
    file_type: [h5_std]

  MIR:
    name: MIR
    resolution: 4000
    wavelength: [3.83, 3.93, 4.03]
    calibration:
      brightness_temperature:
        standard_name: toa_brightness_temperature
        units: K
      radiance:
        standard_name: toa_outgoing_radiance_per_unit_wavelength
        units: mW.cm-2.sr-1.micron-1
      counts:
        standard_name: counts
        units: count
    file_type: [h5_std]

  TIR1:
    name: TIR1
    resolution: 4000
    wavelength: [10.32, 10.82, 11.32]
    calibration:
      brightness_temperature:
        standard_name: toa_brightness_temperature
        units: K
      radiance:
        standard_name: toa_outgoing_radiance_per_unit_wavelength
        units: mW.cm-2.sr-1.micron-1
      counts:
        standard_name: counts
        units: count
    file_type: [h5_std]

  TIR2:
    name: TIR2
    resolution: 4000
    wavelength: [11.46, 11.96, 12.46]
    calibration:
      brightness_temperature:
        standard_name: toa_brightness_temperature
        units: K
      radiance:
        standard_name: toa_outgoing_radiance_per_unit_wavelength
        units: mW.cm-2.sr-1.micron-1
      counts:
