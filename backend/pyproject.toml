[project]
name = "global-mosaic"
version = "0.1.0"
description = "Global geostationary satellite mosaic pipeline"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires already-downloaded real satellite files in data/raw/ (see tests/test_pipeline_integration.py) -- skipped automatically if those files aren't present, not run by default in CI",
]
