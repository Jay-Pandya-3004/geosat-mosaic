# Cache zone for xcube tile responses, referenced from xcube-proxy.conf's
# /tiles/ location. Separate file (http-context, loaded via conf.d) since
# proxy_cache_path can't live inside a server{} block.
#
# TTL/eviction reasoning: tile URLs fully encode their render params
# (dataset id/z/y/x/cmap/vmin/vmax/norm/time/format), and each dataset
# file is immutable once complete, so a cache hit is always correct for a
# finished file. For timestamps still eligible for revision ("partial" in
# schedule_pipeline_state.json), the frontend's own design already handles
# this at the URL level (fixed 2026-08-10): whenever its sync/show-always-recent
# toggle is on, it appends a changing cache-busting query param to tile URLs --
# a different URL is a full cache key miss here too, so no
# separate short-TTL/purge logic is needed for that case. When neither
# toggle is on, the frontend's own design already accepts some staleness
# intentionally.
#
# Sized to cover the full 7-day rolling retention window 2026-08-16
# (was max_size=2g inactive=60m) -- at this scale, "already-accepted
# staleness" isn't good enough on its own if a still-`partial` file gets
# reprocessed in place (patch_tier_file_with_satellite, same filename,
# new content) days after its tiles were first cached: relying purely on
# nginx's own inactive-timeout to eventually re-fetch would mean up to 7
# days of serving wrong tiles for that one file. services/xcube/prewarm_cache.py
# now explicitly detects a reprocessed file (its mtime changing) or a
# file leaving the window entirely, and purges exactly that file's cache
# entries directly (see that script's purge_cache_for() for how, since
# stock nginx has no built-in cache_purge) -- so the long inactive/valid
# window here is safe specifically because that active invalidation
# exists, not despite it being absent.
#
# keys_zone bumped 10m -> 128m to match: nginx's own sizing guidance is
# roughly 8000 keys/MB, and 30g of ~30-50KB tiles is on the order of
# 700k-1M entries -- 10m (~80k keys) would have been the ceiling
# long before max_size, silently capping the cache far below 30g.
#
# Tried moving this to /mnt/e/live_data 2026-08-16 (a Windows E:
# drive, mounted via drvfs/9p) to keep this 30GB/7-day cache off the
# WSL2 root filesystem -- /var/cache lives inside WSL2's own ext4.vhdx,
# itself a file physically backed by Windows C:
# (C:\Users\...\LocalState\ext4.vhdx, 26.9GB and growing), a genuine
# disk-space concern given this cache's size. **Reverted within
# minutes** -- drvfs/9p does not support chmod() at all, which nginx's
# cache-file-finalization step requires; 100% cache write failure, not a
# performance tradeoff.
#
# Moved instead to the THREDDS data SSD (/srv/mosaic-data,
# 2026-08-16) -- a native XFS filesystem (raw disk passthrough via
# `wsl --mount --bare`, not drvfs), so chmod() works fine (unlike E:),
# benchmarked comparable-to-slightly-faster than the
# original /var/cache location for this exact small-file workload (200
# tile-sized files: 0.259s vs 0.297s write, 0.225s vs 0.183s read), and
# has 796G free. Tradeoff: shares physical disk I/O with the actual
# .nc file reads THREDDS/xcube/FastAPI serve from -- accepted given the
# drive's measured speed (3GB/s+ sequential) makes contention
# unlikely to matter in practice.
#
# Hit the exact same permission gotcha this project has hit twice before
# (tomcat, then xcube's own local user) -- /srv/mosaic-data is
# `drwxrws---` group-`thredds-data`-only, so www-data (nginx's user)
# needed `sudo usermod -aG thredds-data www-data` + an nginx restart
# (group membership doesn't apply to an already-running service) before
# it could write here at all. Check this first if a future service hits
# permission errors on this path -- it's not a new problem, it's the
# same one recurring for a new user.
proxy_cache_path /srv/mosaic-data/nginx-xcube-cache levels=1:2 keys_zone=xcube_tiles:128m max_size=30g inactive=7d use_temp_path=off;
