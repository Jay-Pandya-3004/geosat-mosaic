# HTTP/2 TLS reverse proxy in front of xcube (plain HTTP/1.1 on 127.0.0.1:8000).
# Purpose: xcube's Tornado server only speaks HTTP/1.1, which caps browsers
# at 6 concurrent connections per origin -- a bottleneck for a viewport's
# worth of map tiles. Browsers only negotiate HTTP/2 over TLS, hence the
# self-signed cert (LAN-only internal service, no public DNS name).
server {
    # nginx 1.24 (Ubuntu 24.04) predates the standalone `http2 on;`
    # directive (added 1.25.1) -- use the combined listen syntax instead.
    listen 8443 ssl http2;

    server_name _;

    ssl_certificate     /etc/nginx/ssl/xcube-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/xcube-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Tiles specifically get cached -- see xcube-cache.conf for the TTL/
    # correctness reasoning. Everything else (/datasets, /wmts, /colorbars,
    # etc.) is metadata/control-plane, not the CPU-bound raster work this
    # is meant to save, so it stays uncached via the location / fallback.
    location /tiles/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache xcube_tiles;
        # 60m -> 7d 2026-08-16, to match xcube-cache.conf's max_size=30g/
        # inactive=7d (covers the full rolling retention window) -- see
        # that file for why this is safe: services/xcube/prewarm_cache.py now
        # actively purges a file's cache entries on reprocessing or
        # removal, rather than relying on this TTL to eventually notice.
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS: xcube's config.yml applies its own permissive CORS headers,
        # but its Access-Control-Allow-Origin/Access-Control-Allow-Headers
        # are only emitted by xcube's own handlers -- pass them through as-is
        # rather than duplicating/overriding here.
    }
}
